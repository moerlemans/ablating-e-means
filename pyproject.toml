[project]
name = "emeans"
version = "0.1.0"
description = "An ablation of e-means (Bessa et al., arXiv 2611.09501) with a centroid EMA"
requires-python = ">=3.12"
dependencies = [
    "torch==2.5.1",
    "numpy>=1.26",
    "h5py>=3.11",
    "scipy>=1.13",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emeans"]

[tool.pytest.ini_options]
testpaths = ["tests"]
